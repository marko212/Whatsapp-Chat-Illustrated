<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whatsapp Chat Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0b141a;
        }

        .chat-bg {
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            opacity: 0.04;
        }

        mark {
            background-color: #00a884;
            color: #111b21;
            border-radius: 2px;
            padding: 0 2px;
        }

        @keyframes pulse-highlight {
            0% {
                background-color: rgba(0, 168, 132, 0.4);
            }

            100% {
                background-color: transparent;
            }
        }

        .jump-flash {
            animation: pulse-highlight 2s ease-out;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="h-screen flex flex-col text-gray-200 font-sans antialiased overflow-hidden">

    <header class="bg-[#202c33] p-4 flex justify-between items-center border-b border-[#374248] z-20 shrink-0">
        <h1 class="text-lg font-semibold text-[#e9edef]">Whatsapp Chat Viewer</h1>
        <button id="upload-btn" class="bg-[#00a884] hover:bg-[#008f72] text-[#111b21] font-bold py-2 px-4 rounded transition">
            Import Chat File (.txt)
        </button>
    </header>

    <div class="flex flex-1 overflow-hidden relative">

        <aside class="w-64 bg-[#111b21] border-r border-[#374248] flex flex-col z-10 shrink-0">
            <div class="p-3 bg-[#202c33] text-xs font-semibold text-[#8696a0] uppercase tracking-wider border-b border-[#374248]">
                Conversations
            </div>
            <div id="chats-sidebar-list" class="flex-1 overflow-y-auto p-2 space-y-1 no-scrollbar">
                <p class="text-xs text-[#8696a0] text-center pt-8 italic">No chats loaded yet.</p>
            </div>
        </aside>

        <main id="main-chat-view" class="flex-1 relative overflow-y-auto p-6 flex flex-col scroll-smooth">
            <div class="chat-bg absolute inset-0 pointer-events-none"></div>

            <div id="infinite-scroll-trigger" class="h-1 w-full"></div>

            <div id="chat-container" class="relative z-10 w-full max-w-2xl mx-auto space-y-3 flex flex-col pt-4">
                <div class="text-center text-sm text-[#8696a0] bg-[#182229] py-1 px-3 rounded-md self-center">
                    Import a WhatsApp text backup to begin. All languages and emojis supported completely offline.
                </div>
            </div>
        </main>

        <aside class="w-72 bg-[#111b21] border-l border-[#374248] flex flex-col z-10 shrink-0">
            <div class="p-4 bg-[#202c33] space-y-2">
                <label class="text-xs font-semibold text-[#8696a0] uppercase tracking-wider">Search Current Chat</label>
                <input id="search-input"
                       type="text"
                       placeholder="Search..."
                       disabled
                       class="bg-[#111b21] text-[#e9edef] placeholder-[#8696a0] text-sm rounded-lg focus:outline-none focus:ring-1 focus:ring-[#00a884] block w-full p-2.5 disabled:opacity-30" />
            </div>
            <div id="search-results" class="flex-1 overflow-y-auto divide-y divide-[#202c33] p-2 space-y-1 no-scrollbar">
                <p class="text-sm text-[#8696a0] text-center p-4 italic">Select an active conversation to search</p>
            </div>
        </aside>

    </div>

    <script>const uploadBtn = document.getElementById('upload-btn');
    const searchInput = document.getElementById('search-input');
    const chatContainer = document.getElementById('chat-container');
    const searchResultsContainer = document.getElementById('search-results');
    const mainChatView = document.getElementById('main-chat-view');
    const sidebarList = document.getElementById('chats-sidebar-list');

    // Robust international Android log line pattern checker.
    const globalAndroidRegex = /^\[?(\d{1,4}[./-]\d{1,2}[./-]\d{2,4})[,\s]+(\d{1,2}:\d{2}(?::\d{2})?(?:\s?[A-Za-z]{2})?)\]?\s?-\s?([^:]+):\s(.*)$/;
    const urlPattern = /https?:\/\/[^\s]+/g;

    let appState = { chats: {}, activeChatKey: null, scrollStore: {} };
    let renderedCount = 0;
    const CHUNK_SIZE = 150;

    // --- COLD ENGINE INITIALIZATION ---
    window.addEventListener('DOMContentLoaded', () => {
      const persistedState = localStorage.getItem('whatsapp_viewer_state_v3');
      if (persistedState) {
        try {
          const parsed = JSON.parse(persistedState);
          appState.chats = parsed.chats || {};
          appState.activeChatKey = parsed.activeChatKey || null;
          appState.scrollStore = parsed.scrollStore || {};
          if (Object.keys(appState.chats).length > 0) {
            renderSidebar();
            if (appState.activeChatKey) switchConversation(appState.activeChatKey, true);
          }
        } catch (e) {
          console.error("Failed parsing session memory mappings", e);
        }
      }
    });

    function saveState() {
      localStorage.setItem('whatsapp_viewer_state_v3', JSON.stringify(appState));
    }

    // Capture scrolling coordinates for state persistence
    mainChatView.addEventListener('scroll', () => {
      if (appState.activeChatKey && renderedCount >= appState.chats[appState.activeChatKey].messages.length) {
        appState.scrollStore[appState.activeChatKey] = mainChatView.scrollTop;
        saveState();
      } else if (mainChatView.scrollTop < 150 && appState.activeChatKey) {
        // Trigger Virtual Pagination block unrolls when crawling upward
        const initialHeight = mainChatView.scrollHeight;
        renderMoreMessages();
        mainChatView.scrollTop = mainChatView.scrollHeight - initialHeight;
      }
    });

    // --- FILE SYSTEM IMPORT LOOPS ---
    uploadBtn.addEventListener('click', async () => {
      const fileData = await window.electronAPI.openFile();
      if (!fileData || !fileData.content) return;

      const filename = fileData.name;
      const lines = fileData.content.split('\n');
      let chatMessages = [];
      let currentMsg = null;
      let primarySender = null;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const match = line.match(globalAndroidRegex);

        if (match) {
          if (currentMsg) chatMessages.push(currentMsg);
          const sender = match[3].trim();
          if (!primarySender) primarySender = sender;

          currentMsg = {
            id: `msg-${filename.replace(/[^a-zA-Z0-9]/g, '')}-${chatMessages.length}`,
            date: match[1],
            time: match[2],
            sender: sender,
            text: match[4],
            isMedia: match[4].includes('<Media omitted>') || match[4].includes('<Medien ausgeschlossen>') || match[4].includes('<Медиафайлы пропущены>')
          };
        } else if (currentMsg) {
          currentMsg.text += '\n' + line;
        }
      }
      if (currentMsg) chatMessages.push(currentMsg);

      appState.chats[filename] = { name: filename.replace('.txt', ''), primarySender, messages: chatMessages };
      renderSidebar();
      switchConversation(filename, false);
    });

    function renderSidebar() {
      let html = '';
      Object.keys(appState.chats).forEach(key => {
        const chat = appState.chats[key];
        html += `
          <div onclick="switchConversation('${key}', false)" class="p-3 ${key === appState.activeChatKey ? 'bg-[#2a3942] border-[#00a884]' : 'bg-[#182229] border-transparent'} hover:bg-[#202c33] border-l-4 rounded-r-md cursor-pointer transition flex flex-col text-left">
            <span class="font-medium text-[#e9edef] truncate text-sm">${chat.name}</span>
            <span class="text-xs text-[#8696a0]">${chat.messages.length} messages</span>
          </div>
        `;
      });
      sidebarList.innerHTML = html;
    }

    // --- VIEWPORT ACTIVE CONVERSATION DISPATCHER ---
    function switchConversation(chatKey, isColdBoot = false) {
      if (!appState.chats[chatKey]) return;

      appState.activeChatKey = chatKey;
      renderSidebar();

      chatContainer.innerHTML = '';
      renderedCount = 0;

      // Unroll initial block sequence slice backwards
      renderMoreMessages();

      searchInput.disabled = false;
      searchInput.value = '';
      searchResultsContainer.innerHTML = '<p class="text-sm text-[#8696a0] text-center p-4">Type to search inside this thread.</p>';

      if (isColdBoot && appState.scrollStore[chatKey] !== undefined) {
        // Hydrate scroll up onto full rendering array limit structures
        while (renderedCount < appState.chats[chatKey].messages.length) {
          renderMoreMessages();
        }
        mainChatView.scrollTop = appState.scrollStore[chatKey];
      } else {
        mainChatView.scrollTop = mainChatView.scrollHeight;
      }
      saveState();
    }

    function renderMoreMessages() {
      const activeChat = appState.chats[appState.activeChatKey];
      if (!activeChat || renderedCount >= activeChat.messages.length) return;

      const total = activeChat.messages.length;
      const nextSliceBound = Math.min(renderedCount + CHUNK_SIZE, total);
      let html = '';

      // Render items sequentially via historical stack prepending loops
      for (let i = total - 1 - renderedCount; i >= total - nextSliceBound; i--) {
        const msg = activeChat.messages[i];
        const isSelf = msg.sender === activeChat.primarySender;
        const isRTL = /[\u0590-\u05FF\u0600-\u06FF]/.test(msg.text);

        const bubbleClass = isSelf
          ? 'bg-[#005c4b] text-[#e9edef] self-end rounded-tl-lg rounded-bl-lg rounded-br-lg'
          : 'bg-[#202c33] text-[#e9edef] self-start rounded-tr-lg rounded-bl-lg rounded-br-lg';

        let txtContent = msg.text;
        const links = msg.text.match(urlPattern);
        let previewContainer = '';

        if (links && !msg.isMedia) {
          links.forEach(url => {
            txtContent = txtContent.replace(url, `<a href="${url}" target="_blank" class="text-[#53bdeb] hover:underline">${url}</a>`);
          });
          previewContainer = `<div id="preview-${msg.id}" class="mt-2 text-left hidden"></div>`;
          triggerLazyPreview(msg.id, links[0]);
        }

        html = `
          <div id="${msg.id}" class="max-w-[75%] p-2.5 shadow-md flex flex-col relative ${bubbleClass} w-full" style="direction: ${isRTL ? 'rtl' : 'ltr'}">
            <span class="text-xs font-bold text-[#53bdeb] mb-1">${msg.sender}</span>
            ${msg.isMedia ? `
              <div class="flex items-center space-x-2 text-[#8696a0] bg-[#111b21] p-3 rounded border border-[#374248]"><span>📷</span><span class="italic text-sm">Media Attachment</span></div>
            ` : `
              <p class="whitespace-pre-wrap text-[15px] leading-relaxed pr-12 ${isRTL ? 'text-right' : 'text-left'}">${txtContent}</p>
              ${previewContainer}
            `}
            <span class="text-[11px] text-[#8696a0] absolute bottom-1 ${isRTL ? 'left-2' : 'right-2'}">${msg.time}</span>
          </div>
        ` + html;
      }

      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = html;
      while (tempDiv.firstChild) {
        chatContainer.insertBefore(tempDiv.firstChild, chatContainer.firstChild);
      }

      renderedCount = nextSliceBound;
    }

    // Async lazy preview compiler loader
    async function triggerLazyPreview(msgId, targetUrl) {
      setTimeout(async () => {
        const targetElement = document.getElementById(`preview-${msgId}`);
        if (!targetElement) return;

        const data = await window.electronAPI.getLinkPreview(targetUrl);
        if (!data || !data.title) return;

        targetElement.innerHTML = `
          <a href="${data.url}" target="_blank" class="flex flex-col bg-[#111b21] border border-[#374248] rounded overflow-hidden mt-1 max-w-full hover:opacity-90 transition">
            ${data.image ? `<img src="${data.image}" class="w-full h-28 object-cover opacity-80" onerror="this.remove()">` : ''}
            <div class="p-2 space-y-0.5 max-w-full">
              <h4 class="text-xs font-bold text-[#e9edef] truncate">${data.title}</h4>
              <p class="text-[11px] text-[#8696a0] line-clamp-2 leading-tight">${data.description}</p>
            </div>
          </a>
        `;
        targetElement.classList.remove('hidden');
      }, 50);
    }

    // --- QUICK SUBSTRING SIDEBAR ENGINE ---
    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      if (!query || !appState.activeChatKey) {
        searchResultsContainer.innerHTML = '<p class="text-sm text-[#8696a0] text-center p-4">Type to search inside this thread.</p>';
        return;
      }

      const activeChat = appState.chats[appState.activeChatKey];
      const matches = [];

      for (let i = 0; i < activeChat.messages.length; i++) {
        if (activeChat.messages[i].text.toLowerCase().includes(query)) {
          matches.push(activeChat.messages[i]);
          if (matches.length > 80) break;
        }
      }

      renderSidebarResults(matches, query);
    });

    function renderSidebarResults(matches, query) {
      if (matches.length === 0) {
        searchResultsContainer.innerHTML = '<p class="text-sm text-[#8696a0] text-center p-4">No results found.</p>';
        return;
      }

      let html = '';
      const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');

      matches.forEach(msg => {
        const isRTL = /[\u0590-\u05FF\u0600-\u06FF]/.test(msg.text);
        html += `
          <div onclick="jumpToMessage('${msg.id}')" class="p-3 hover:bg-[#202c33] rounded-lg cursor-pointer transition text-left block w-full" style="direction: ${isRTL ? 'rtl' : 'ltr'}">
            <div class="flex justify-between items-center text-xs text-[#8696a0]">
              <span class="font-semibold text-[#53bdeb] truncate max-w-[120px]">${msg.sender}</span>
              <span>${msg.date}</span>
            </div>
            <p class="text-sm text-[#e9edef] line-clamp-2">${msg.text.replace(regex, '<mark>$1</mark>')}</p>
          </div>
        `;
      });
      searchResultsContainer.innerHTML = html;
    }

    window.jumpToMessage = function(targetId) {
      let element = document.getElementById(targetId);
      if (!element) {
        const activeChat = appState.chats[appState.activeChatKey];
        while (renderedCount < activeChat.messages.length) {
          renderMoreMessages();
        }
        element = document.getElementById(targetId);
      }

      if (!element) return;
      element.scrollIntoView({ behavior: 'smooth', block: 'center' });
      element.classList.add('jump-flash');
      setTimeout(() => element.classList.remove('jump-flash'), 2000);
    };</script>
</body>
</html>
